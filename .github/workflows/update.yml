name: update-etf

on:
  schedule:
    # 每个交易日（北京时间周二~周六）早上三次，分钟故意选冷门值（:17/:47）以减少 GitHub 排队延迟：
    #   北京 08:17（UTC 00:17）— 白银 SLV 通常已发布
    #   北京 10:17（UTC 02:17）— 黄金 GLD 大概率已发布
    #   北京 11:47（UTC 03:47）— GLD 兜底
    # data/seen_log.csv 会记录官网"首次看到新数据"的时间，用来之后再调整。
    - cron: "17 0,2 * * 2-6"
    - cron: "47 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取 ETF 持仓与价格，内嵌进页面
        run: python scripts/update.py
      - name: 有变化则提交
        run: |
          if [ -n "$(git status --porcelain data index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data index.html
            git commit -m "update ETF holdings $(date -u +%F)"
            git push
          fi
