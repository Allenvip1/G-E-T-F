name: update-etf

on:
  schedule:
    # 北京时间周二~周六 04:05~09:05 每小时一次（UTC 周一~周五 20:05~23:05、周二~周六 00:05~01:05），
    # 用来摸清官网每天几点更新；data/seen_log.csv 会记录"首次看到新数据"的时间。摸清后可收窄。
    - cron: "5 20-23 * * 1-5"
    - cron: "5 0-1 * * 2-6"
    - cron: "30 4 * * 2-6"   # 北京时间 12:30 兜底
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取 ETF 持仓与价格，内嵌进页面
        run: python scripts/update.py
      - name: 有变化则提交
        run: |
          if [ -n "$(git status --porcelain data index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data index.html
            git commit -m "update ETF holdings $(date -u +%F)"
            git push
          fi
