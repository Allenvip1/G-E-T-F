<script>
const D = window.ETF_DATA;
const $ = id => document.getElementById(id);
const METALS = [
  { key: "gold", name: "黄金", etf: "SPDR Gold Trust（GLD）", price: "COMEX 黄金期货连续合约 GC=F", color: "#ffb300", pd: 1, ed: 1 },
  { key: "silver", name: "白银", etf: "iShares Silver Trust（SLV）", price: "COMEX 白银期货连续合约 SI=F", color: "#29b6f6", pd: 2, ed: 1 },
];
const css = { layout: { background: { color: "#1e222d" }, textColor: "#d1d4dc" },
  grid: { vertLines: { color: "#262b38" }, horzLines: { color: "#262b38" } },
  rightPriceScale: { borderColor: "#2a2e39", minimumWidth: 72 }, timeScale: { borderColor: "#2a2e39", rightOffset: 3 }, crosshair: { mode: 0 } };
const fmt = (v, d = 1) => v == null ? "–" : v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (v, d = 1) => v == null ? "–" : `<span class="${v > 0 ? "u" : v < 0 ? "d" : ""}">${v > 0 ? "+" : ""}${fmt(v, d)}</span>`;
const monday = s => { const t = new Date(s + "T00:00:00Z"); const k = (t.getUTCDay() + 6) % 7; return new Date(t - k * 864e5).toISOString().slice(0, 10); };

function derive(etf) {            // etf: [[date, tonnes]]
  const out = [], base = new Map();
  let wk = null, wkBase = null, prev = null;
  for (let i = 0; i < etf.length; i++) {
    const [d, t] = etf[i], w = monday(d);
    if (w !== wk) { wk = w; wkBase = prev; }
    out.push({ date: d, t, w, day: prev == null ? null : t - prev, week: wkBase == null ? null : t - wkBase });
    prev = t;
  }
  const tot = new Map(); out.forEach(r => tot.set(r.w, r.week));      // 每周最后一个交易日的累计 = 整周净变化
  out.forEach(r => { r.weekTotal = tot.get(r.w); });
  return out;
}
const ALL = [];                    // 所有图表 {el, chart, series, get(date)}
let HOVER = null, ACTIVE = null, syncC = false, CAL = [];

function mk(el, h) { return LightweightCharts.createChart(el, { ...css, width: el.clientWidth, height: h }); }
function build() {
  const dates = new Set();
  METALS.forEach(m => { const x = D[m.key]; x.price.forEach(r => dates.add(r[0])); x.etf.forEach(r => dates.add(r[0])); });
  CAL = [...dates].sort();
  METALS.forEach(m => {
    const x = D[m.key]; m.rows = derive(x.etf); m.byDate = new Map(m.rows.map(r => [r.date, r])); m.pByDate = new Map(x.price.map(r => [r[0], r]));
    const col = document.createElement("div"); col.className = "col";
    col.innerHTML = `<h2>${m.name}</h2><div class="legend" id="lg_${m.key}"></div>
      <div class="card"><div class="ttl">① ${m.name}日线（${m.price}）· 红涨绿跌</div><div id="p_${m.key}"></div></div>
      <div class="card"><div class="ttl"><i style="background:${m.color}"></i>② ${m.etf} 持仓吨数</div><div id="e_${m.key}"></div></div>
      <div class="card"><div class="ttl">③ 每日变化（吨）· 红增持 绿减持</div><div id="d_${m.key}"></div></div>
      <div class="card"><div class="ttl">④ 本周累计变化（吨）· 当周周一起算，每周重新归零 · 红增持 绿减持</div><div id="w_${m.key}"></div></div>`;
    $("grid").appendChild(col);
    const dp = m.key === "gold" ? 1 : 2;
    const cp = mk($("p_" + m.key), 300), ce = mk($("e_" + m.key), 200), cw = mk($("w_" + m.key), 160), cd = mk($("d_" + m.key), 160);
    const candle = cp.addCandlestickSeries({ upColor: "#ef5350", downColor: "#26a69a", borderUpColor: "#ef5350", borderDownColor: "#26a69a", wickUpColor: "#ef5350", wickDownColor: "#26a69a",
      priceFormat: { type: "price", precision: dp, minMove: Math.pow(10, -dp) } });
    candle.setData(x.price.map(r => ({ time: r[0], open: r[1], high: r[2], low: r[3], close: r[4] })));
    const line = ce.addLineSeries({ color: m.color, lineWidth: 2, priceLineVisible: false, priceFormat: { type: "price", precision: m.key === "gold" ? 1 : 0, minMove: m.key === "gold" ? 0.1 : 1 } });
    line.setData(m.rows.map(r => ({ time: r.date, value: r.t })));
    const hist = (c, key) => { const s = c.addHistogramSeries({ priceLineVisible: false, lastValueVisible: true, priceFormat: { type: "price", precision: 1, minMove: 0.1 } });
      s.setData(m.rows.filter(r => r[key] != null).map(r => ({ time: r.date, value: r[key], color: r[key] >= 0 ? "#ef5350" : "#26a69a" }))); return s; };
    const sw = hist(cw, "week"), sd = hist(cd, "day");
    [cp, ce, cw, cd].forEach(c => c.addLineSeries({ visible: false, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false }).setData(CAL.map(t => ({ time: t }))));
    const reg = (el, chart, series, get) => ALL.push({ kind: el, metal: m.key, el: $(el + "_" + m.key), chart, series, get });
    reg("p", cp, candle, d => { const r = m.pByDate.get(d); return r ? r[4] : null; });
    reg("e", ce, line, d => { const r = m.byDate.get(d); return r ? r.t : null; });
    reg("w", cw, sw, d => { const r = m.byDate.get(d); return r && r.week != null ? r.week : null; });
    reg("d", cd, sd, d => { const r = m.byDate.get(d); return r && r.day != null ? r.day : null; });
  });
  bind();
  legend(null);
  summary();
}
const WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const wday = d => WD[new Date(d + "T00:00:00Z").getUTCDay()];
const row = (k, v) => `<div class="r"><span>${k}</span><span>${v}</span></div>`;
function tipHtml(e, t) {
  const m = METALS.find(x => x.key === e.metal), dp = m.key === "gold" ? 2 : 2;
  const head = `<div class="h">${m.name} · ${t} ${wday(t)}</div>`;
  if (e.kind === "p") {
    const r = m.pByDate.get(t); if (!r) return head + `<div class="r"><span>当日无期货行情</span><span></span></div>`;
    const chg = (r[4] / r[1] - 1) * 100;
    return head + row("开", fmt(r[1], dp)) + row("高", fmt(r[2], dp)) + row("低", fmt(r[3], dp)) + row("收", `<b>${fmt(r[4], dp)}</b>`) + row("日内涨跌", sgn(chg, 2) + "%");
  }
  const r = m.byDate.get(t); if (!r) return head + `<div class="r"><span>当日无 ETF 数据</span><span></span></div>`;
  const isWeek = e.kind === "w", isDay = e.kind === "d";
  return head + row("持仓", `<b>${fmt(r.t, 2)} 吨</b>`) +
    row(isDay ? "<b>当日变化</b>" : "当日变化", `<span class="${isDay ? "big" : ""}">${sgn(r.day, 2)} 吨</span>`) +
    row(isWeek ? "<b>本周累计（截至当日）</b>" : "本周累计（截至当日）", `<span class="${isWeek ? "big" : ""}">${sgn(r.week, 2)} 吨</span>`) +
    row("整周合计（周一至周五）", `${sgn(r.weekTotal, 2)} 吨`);
}
function showTip(e, p) {
  const tip = e.tip;
  if (!p.time || !p.point || p.point.x < 0 || p.point.y < 0) { tip.style.display = "none"; return; }
  tip.innerHTML = tipHtml(e, p.time); tip.style.display = "block";
  const W = e.el.clientWidth, H = e.el.clientHeight, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = p.point.x + 18, y = p.point.y - h / 2;
  if (x + w > W - 4) x = p.point.x - w - 18;
  tip.style.left = Math.max(2, x) + "px"; tip.style.top = Math.max(2, Math.min(H - h - 2, y)) + "px";
}
function summary() {

  const tot = m => dates.reduce((a, d) => a + ((m.byDate.get(d) || {}).day || 0), 0);
  $("sum").innerHTML = `<div class="col" style="grid-column:1/-1"><div class="card"><div class="ttl">近 30 个交易日每日吨位变化（吨，最新在前；红增持 绿减持）　30 日合计：黄金 ${sgn(tot(g), 2)}　白银 ${sgn(tot(v), 2)}　本周累计：黄金 ${sgn(g.rows[g.rows.length - 1].week, 2)}　白银 ${sgn(v.rows[v.rows.length - 1].week, 2)}</div>
    <table><thead><tr><th>日期</th><th>黄金 ETF 每日变化</th><th>白银 ETF 每日变化</th></tr></thead><tbody>` +
    dates.map(d => `<tr><td>${d} ${wday(d)}</td><td>${cell(g, d)}</td><td>${cell(v, d)}</td></tr>`).join("") + `</tbody></table></div></div>`;
}
function legend(t) {
  METALS.forEach(m => {
    const rows = m.rows; let r = t ? m.byDate.get(t) : null;
    if (!r) { if (t) { for (let i = rows.length - 1; i >= 0; i--) if (rows[i].date <= t) { r = rows[i]; break; } } if (!r) r = rows[rows.length - 1]; }
    const p = m.pByDate.get(r.date) || null;
    $("lg_" + m.key).innerHTML = `<span>日期 <b>${r.date}</b></span><span>持仓 <b>${fmt(r.t, m.key === "gold" ? 2 : 1)}</b> 吨</span><span>当日变化 <b>${sgn(r.day, 2)}</b></span><span>本周累计 <b>${sgn(r.week, 2)}</b></span>` +
      (p ? `<span>日线 开 <b>${fmt(p[1], 2)}</b> 高 <b>${fmt(p[2], 2)}</b> 低 <b>${fmt(p[3], 2)}</b> 收 <b>${fmt(p[4], 2)}</b></span>` : "");
  });
}
function bind() {
  ALL.forEach(e => {
    e.el.style.position = "relative"; e.tip = document.createElement("div"); e.tip.className = "tip"; e.el.appendChild(e.tip);
    e.el.addEventListener("mouseenter", () => { HOVER = e; });
    e.el.addEventListener("mouseleave", () => { if (HOVER === e) HOVER = null; e.tip.style.display = "none"; });
    ["mouseenter", "mousedown", "touchstart", "wheel"].forEach(ev => e.el.addEventListener(ev, () => { ACTIVE = e; }, { passive: true }));
    e.chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (!r || ACTIVE !== e) return; ALL.forEach(o => { if (o !== e) o.chart.timeScale().setVisibleLogicalRange(r); }); });
    e.chart.subscribeCrosshairMove(p => {
      if (syncC) return; const t = p.time || null; if (HOVER && HOVER !== e) return;     // 同步产生的光标事件不处理，只响应鼠标真正所在的那张图
      legend(t); showTip(e, p); syncC = true;
      ALL.forEach(o => { if (o === e) return; if (!t) { o.chart.clearCrosshairPosition(); return; } const v = o.get(t); if (v == null) o.chart.clearCrosshairPosition(); else o.chart.setCrosshairPosition(v, t, o.series); });
      syncC = false;
    });
  });
  document.querySelectorAll(".controls button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".controls button").forEach(x => x.classList.toggle("on", x === b)); setRange(+b.dataset.m);
  });
  addEventListener("resize", () => ALL.forEach(e => e.chart.applyOptions({ width: e.el.clientWidth })));
}
function setRange(months) {
  ACTIVE = null;
  const last = CAL[CAL.length - 1];
  let from = CAL[0];
  if (months) { const d = new Date(last + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - months); from = d.toISOString().slice(0, 10); }
  ALL.forEach(e => { try { e.chart.timeScale().setVisibleRange({ from, to: last }); } catch (x) { e.chart.timeScale().fitContent(); } });
}
if (!D) { $("meta").textContent = "没有数据：请先运行 scripts/update.py"; }
else {
  build(); setRange(12);
  const g = D.gold.etf, s = D.silver.etf;
  $("meta").innerHTML = `ETF 数据：GLD 截至 <b>${g[g.length - 1][0]}</b>，SLV 截至 <b>${s[s.length - 1][0]}</b> · 页面更新于 ${D.updated}`;
  $("note").innerHTML = `数据来源：SPDR Gold Shares 官网历史档案（黄金总吨数）；iShares 官网（白银流通份额、产品页 Ounces in Trust）；价格为 Yahoo Finance COMEX 期货连续合约日线。<br>
    白银吨数 = 流通份额 × 每股含银盎司（固定 0.9031，取自 2026-10-06 官网公布的 Ounces in Trust）÷ 32,150.75：每日变化只反映份额的申购/赎回；吨数绝对值有极小偏差。<br>
    ETF 官网在美股收盘后公布当日数据，所以最新一天的 ETF 数据可能晚于价格。ETF 份额只在大额申购/赎回时才变，多日持平很正常。仅供研究，不构成投资建议。
    图表由 <a href="https://tradingview.com" target="_blank" rel="noopener" style="color:#6ea8fe">TradingView</a> Lightweight Charts™ 提供。`;
}
